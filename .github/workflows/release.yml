name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows Executable
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: dist/mediacrush.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux Binary
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-linux --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
          chmod +x dist/mediacrush-linux
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: dist/mediacrush-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build macOS Binary (Apple Silicon)
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-macos --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
          chmod +x dist/mediacrush-macos
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-macos
          path: dist/mediacrush-macos

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: dist_all
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_all/mediacrush.exe
            dist_all/mediacrush-linux
            dist_all/mediacrush-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish to PyPI
        if: env.PYPI_TOKEN != ''
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine upload dist/*.whl dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
