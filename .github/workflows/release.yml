name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Windows x64 (CLI + Flutter Desktop Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Build Windows x64 CLI
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-windows-x64 --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Windows Flutter Desktop
        run: |
          cd desktop
          flutter pub get
          flutter build windows --release

      - name: Assemble Windows Desktop Staging Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\MediaCrush-Windows-x64 | Out-Null
          Copy-Item -Path "desktop\build\windows\x64\runner\Release\*" -Destination "dist\MediaCrush-Windows-x64" -Recurse -Force

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc scripts\windows_installer.iss

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          path: |
            dist/mediacrush-windows-x64.exe
            dist/MediaCrush-Windows-Setup-x64.exe

  build-windows-x86:
    name: Windows x86 (Legacy 32-bit CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"
          cache: "pip"
      - name: Build Windows x86 Binary
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-windows-x86 --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
      - name: Upload Windows x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-binary
          path: dist/mediacrush-windows-x86.exe

  build-windows-arm64:
    name: Windows ARM64 (Snapdragon X CLI)
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ARM64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
      - name: Build Windows ARM64 Binary
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-windows-arm64 --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-binary
          path: dist/mediacrush-windows-arm64.exe

  build-linux-x86_64:
    name: Linux x86_64 (CLI + Desktop Bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Build Linux x86_64 CLI
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-linux-x86_64 --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
          chmod +x dist/mediacrush-linux-x86_64
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux Flutter Desktop
        run: |
          bash build_desktop_linux.sh
      - name: Upload Linux x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-binaries
          path: |
            dist/mediacrush-linux-x86_64
            dist/MediaCrush-Linux-x64.tar.gz

  build-linux-arm64:
    name: Linux ARM64 (aarch64 CLI)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux ARM64 Binary
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-linux-arm64 --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
          chmod +x dist/mediacrush-linux-arm64
      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-binary
          path: dist/mediacrush-linux-arm64

  build-macos:
    name: macOS (CLI + Native .dmg Installer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Build macOS CLI
        run: |
          python -m pip install --upgrade pip pyinstaller -e .
          pyinstaller --onefile --name mediacrush-macos --hidden-import mediacrush.gui.app --hidden-import mediacrush.gui.worker --hidden-import mediacrush.gui.components mediacrush_launcher.py
          chmod +x dist/mediacrush-macos
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build macOS Flutter Desktop and .dmg Installer
        run: |
          bash build_desktop_macos.sh
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/mediacrush-macos
            dist/MediaCrush-macOS-Universal.dmg

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-windows-x64
      - build-windows-x86
      - build-windows-arm64
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_all
          merge-multiple: true
      - name: Publish All Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish to PyPI
        if: env.PYPI_TOKEN != ''
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine upload dist/*.whl dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
